version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=sqlite:///./blx_banco.db
    networks:
      - blx-network

  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - blx-network

networks:
  blx-network:
    driver: bridge
