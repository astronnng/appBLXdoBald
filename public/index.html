<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLX - Sua vitrine de produtos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <div id="app">
        <!-- Barra de Navegação -->
        <nav class="glass-nav">
            <div class="logo">
                <span class="accent">BLX</span> Marketplace
            </div>
            <div class="nav-links" id="nav-links">
                <!-- Dinâmico -->
            </div>
        </nav>

        <main class="container">
            <!-- Seção de Autenticação (Login/Cadastro) -->
            <section id="auth-section" class="auth-card glass-card hidden">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchAuthTab('login')">Login</button>
                    <button class="tab-btn" onclick="switchAuthTab('signup')">Cadastro</button>
                </div>
                
                <form id="login-form" class="auth-form">
                    <h2>Bem-vindo de volta</h2>
                    <input type="text" id="login-phone" placeholder="Telefone" required>
                    <input type="password" id="login-pass" placeholder="Senha" required>
                    <button type="submit" class="btn-primary">Entrar</button>
                </form>

                <form id="signup-form" class="auth-form hidden">
                    <h2>Crie sua conta</h2>
                    <input type="text" id="signup-name" placeholder="Nome Completo" required>
                    <input type="text" id="signup-phone" placeholder="Telefone" required>
                    <input type="password" id="signup-pass" placeholder="Sua Senha" required>
                    <button type="submit" class="btn-primary">Cadastrar</button>
                </form>
            </section>

            <!-- Dashboard de Produtos -->
            <section id="products-section" class="hidden">
                <header class="section-header">
                    <h1>Explore Produtos</h1>
                    <button class="btn-secondary" onclick="showModal('product-modal')">+ Novo Produto</button>
                </header>
                <div id="products-grid" class="products-grid">
                    <!-- Cards de produtos serão inseridos aqui -->
                    <div class="loader">Carregando produtos...</div>
                </div>
            </section>

            <!-- Modal de Novo Produto -->
            <div id="product-modal" class="modal hidden">
                <div class="modal-content glass-card">
                    <span class="close" onclick="hideModal('product-modal')">&times;</span>
                    <h2>Publicar Novo Produto</h2>
                    <form id="product-form">
                        <input type="text" id="prod-name" placeholder="Nome do Produto" required>
                        <textarea id="prod-desc" placeholder="Descrição curta"></textarea>
                        <input type="number" id="prod-price" placeholder="Preço (R$)" step="0.01" required>
                        <label class="checkbox-container">
                            Disponível para venda
                            <input type="checkbox" id="prod-avail" checked>
                            <span class="checkmark"></span>
                        </label>
                        <button type="submit" class="btn-primary">Publicar</button>
                    </form>
                </div>
            </div>

            <!-- Meus Pedidos -->
            <section id="orders-section" class="hidden">
                <h1>Seus Pedidos</h1>
                <div id="orders-list" class="orders-list">
                    <!-- Lista de pedidos -->
                </div>
            </section>
        </main>

        <!-- Toast Notifications -->
        <div id="toast" class="toast hidden"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
