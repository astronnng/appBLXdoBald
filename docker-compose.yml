services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # In production we don't mount the source; use the built image.
    # Persist only the DB in a named volume for portability across hosts.
    volumes:
      - db-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DB_FILE=data/blx_banco.db
    env_file: .env
    # Mantemos o volume para o banco de dados persistente
    # Ou mapeamos o arquivo local para o container
    command: uvicorn src.server:app --reload --host 0.0.0.0 --port 8000

volumes:
  db-data:
